name: CCTV · Diagnosa QR
# Dijalankan manual. Mengambil frame kamera meja packing ±150 detik di VPS dan mencoba beberapa cara membaca QR.
# Log repo publik: hanya angka (ukuran frame/QR, jumlah berhasil per cara). Tidak ada gambar, isi label, atau rahasia.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: cctv-production
    steps:
      - name: Uji pembacaan QR di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.CCTV_VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.CCTV_VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.CCTV_VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY || secrets.CCTV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS || secrets.CCTV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in VPS_HOST VPS_PORT VPS_USER; do
            printf -v "$variable" '%s' "$(printf '%s' "${!variable}" | tr -d '[:space:]')"
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/cctv_deploy && chmod 600 ~/.ssh/cctv_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/cctv_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          echo "== Stream di relay go2rtc: nama, jumlah sumber aktif, jumlah pembaca (alamat DVR tidak dicetak)"
          docker exec cctvslm-vision-1 python -c "
          import json, urllib.request
          data = json.load(urllib.request.urlopen('http://go2rtc:1984/api/streams', timeout=5))
          for name, info in sorted(data.items()):
              info = info or {}
              live = sum(1 for p in (info.get('producers') or []) if p.get('medias') or p.get('receivers'))
              print(f'{name}: sumber aktif {live}, pembaca {len(info.get(\"consumers\") or [])}')
          " 2>&1 | tail -20 || true
          # Stream kamera label yang sedang dibaca pemroses video (nama relay saja, mis. ch1401).
          QR_STREAM=$(docker exec cctvslm-vision-1 python -c "
          import json, urllib.request
          data = json.load(urllib.request.urlopen('http://go2rtc:1984/api/streams', timeout=5))
          used = [n for n, i in sorted(data.items()) if (i or {}).get('consumers') and not n.endswith('h264')]
          print((used or ['ch1401'])[0])
          " 2>/dev/null || echo ch1401)
          echo "stream untuk uji QR: $QR_STREAM"
          echo "== Stream kamera meja packing ($QR_STREAM) lewat relay"
          docker exec cctvslm-vision-1 sh -c 'command -v ffprobe >/dev/null && ffprobe -v error -rtsp_transport tcp -select_streams v:0 -show_entries stream=codec_name,width,height,sample_aspect_ratio,display_aspect_ratio,r_frame_rate -of compact rtsp://go2rtc:8554/'"$QR_STREAM"' || echo "ffprobe tidak ada di image"' 2>&1 | tail -2
          echo "== Resolusi yang benar-benar diterima server per stream (1 frame per stream, container sementara)"
          docker run --rm -i --network cctvslm_default --memory 256m --memory-swap 256m --cpus 0.5 --pids-limit 64 \
            --entrypoint nice cctvslm-vision:latest -n 15 python - <<'PY' 2>&1 | grep -v -E "^\[(hevc|rtsp)" || true
          import os, time, cv2
          os.environ["OPENCV_FFMPEG_CAPTURE_OPTIONS"] = "rtsp_transport;tcp|threads;1"
          for name in ["ch1401", "ch1402", "ch1301", "ch1302", "ch1201", "ch1202"]:
              cap = cv2.VideoCapture(f"rtsp://go2rtc:8554/{name}", cv2.CAP_FFMPEG)
              ok, frame, t0 = False, None, time.time()
              while time.time() - t0 < 8 and not ok:
                  ok, frame = cap.read()
              cap.release()
              print(f"{name}: " + (f"{frame.shape[1]}x{frame.shape[0]}" if ok else "tidak ada frame"))
          PY
          echo "== Pengaturan resolusi di DVR (ISAPI, lewat alamat speaker; hanya codec/resolusi/fps)"
          docker exec cctvslm-web-1 php artisan tinker --execute='
            $camera = App\Models\Camera::find(1); $e = $camera ? App\Services\CameraSpeaker::endpoint($camera) : null;
            if (!$e) { echo "alamat DVR tidak tersedia\n"; return; }
            foreach (["1401", "1402", "1301", "1201"] as $id) {
              try {
                $r = Illuminate\Support\Facades\Http::timeout(8)->withDigestAuth($e["user"], $e["pass"])->get($e["base"]."/ISAPI/Streaming/channels/".$id);
                if (!$r->successful()) { echo "$id: HTTP ".$r->status()."\n"; continue; }
                $x = @simplexml_load_string($r->body()); $v = $x ? $x->Video : null;
                echo $id.": ".($v ? $v->videoCodecType." ".$v->videoResolutionWidth."x".$v->videoResolutionHeight." fps ".((int) $v->maxFrameRate / 100) : "format tidak dikenal")."\n";
              } catch (Throwable $t) { echo "$id: ".class_basename($t)."\n"; }
            }' 2>/dev/null || true
          echo "== Variabel pembacaan label (nama saja)"
          docker exec cctvslm-vision-1 sh -c 'env | grep -E "^CCTV_(LABEL|WORK|RTSP_RELAY|PROCESS_FPS|AI_API_KEY)" | sed -E "s/^(CCTV_AI_API_KEY)=.+/\1=(ada)/"'
          echo "== Cadangan Gemini: uji model dan kunci yang dipakai pembaca label"
          docker exec -i cctvslm-vision-1 python - <<'PY'
          import os, requests
          key = os.getenv("CCTV_AI_API_KEY") or os.getenv("GEMINI_API_KEY") or ""
          model = os.getenv("CCTV_AI_MODEL", "gemini-3.5-flash-lite")
          if not key:
              print("kunci Gemini kosong")
          else:
              r = requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                                json={"contents": [{"parts": [{"text": "Balas OK"}]}]}, headers={"x-goog-api-key": key}, timeout=20)
              msg = (r.json().get("error") or {}).get("message", "") if r.headers.get("content-type", "").startswith("application/json") else ""
              print(f"model {model}: HTTP {r.status_code} {msg[:200]}")
          PY
          echo "== Sumber pembacaan label 30 hari (Gemini / OpenCV), per hari"
          docker exec cctvslm-web-1 php artisan tinker --execute='foreach (App\Models\LabelRecord::where("created_at", ">=", now()->subDays(30))->selectRaw("date(created_at) as d, sum(case when raw_ocr like \"Gemini%\" then 1 else 0 end) as gemini, count(*) as n")->groupBy("d")->orderBy("d")->get() as $r) echo "$r->d: total $r->n, lewat Gemini $r->gemini\n";' 2>/dev/null || true
          echo "== Uji baca QR ±150 detik (container sementara terpisah: maks 384 MB, 0,5 CPU, prioritas rendah)"
          free -m | awk 'NR==2{print "RAM VPS tersedia: " $7 " MB"}'
          # Tidak di dalam container pemroses video: kalau uji ini kehabisan memori, hanya uji ini yang berhenti.
          # Membaca lewat relay go2rtc, jadi tidak membuka sambungan tambahan ke DVR.
          docker run --rm -i --network cctvslm_default --memory 384m --memory-swap 384m --cpus 0.5 --cpu-shares 128 \
            --pids-limit 64 -e QR_STREAM="$QR_STREAM" --entrypoint nice cctvslm-vision:latest -n 15 python - <<'PY'
          import os, re, time, statistics, resource, cv2
          # Hemat memori: decoder satu thread (buffer frame per thread), OpenCV satu thread.
          os.environ["OPENCV_FFMPEG_CAPTURE_OPTIONS"] = "rtsp_transport;tcp|threads;1"
          cv2.setNumThreads(1)
          INVOICE = re.compile(r"(MJ-\d{8}-\d{4}|(?<!\d)\d{6}-\d{2})(?!\d)")
          cap = cv2.VideoCapture("rtsp://go2rtc:8554/" + os.environ.get("QR_STREAM", "ch1401"), cv2.CAP_FFMPEG)
          det = cv2.QRCodeDetector()
          wechat = None
          try:
              wechat = cv2.wechat_qrcode_WeChatQRCode()
          except Exception:
              pass
          methods = ["asli", "rasio_diperbaiki", "potong_qr_3x", "potong_qr_3x_tajam", "wechat"]
          ok = {m: 0 for m in methods}
          invoice = {m: 0 for m in methods}
          frames = seen = 0
          # Diproses 2 frame per detik dan frame diperkecil ke lebar maksimal 1280 seperti pemroses label.
          sizes, shape = [], None
          def decode(img):
              try:
                  found, values, _, _ = det.detectAndDecodeMulti(img)
                  vals = [v for v in (values if found else []) if v]
                  if not vals:
                      v, _, _ = det.detectAndDecode(img)
                      vals = [v] if v else []
                  return vals
              except Exception:
                  return []
          t0 = time.time(); last = 0
          while time.time() - t0 < 150:
              if not cap.grab():
                  time.sleep(0.5); continue
              if time.time() - last < 0.5:
                  continue
              last = time.time()
              ret, frame = cap.retrieve()
              if not ret:
                  continue
              frames += 1; shape = frame.shape
              found, pts = det.detect(frame)
              if not found or pts is None:
                  continue
              seen += 1
              xs, ys = pts[:, :, 0] if pts.ndim == 3 else pts[:, 0], pts[:, :, 1] if pts.ndim == 3 else pts[:, 1]
              w, h = float(xs.max() - xs.min()), float(ys.max() - ys.min())
              sizes.append((w, h))
              H, W = frame.shape[:2]
              x0, x1 = int(max(0, xs.min() - w)), int(min(W, xs.max() + w))
              y0, y1 = int(max(0, ys.min() - h)), int(min(H, ys.max() + h))
              crop = frame[y0:y1, x0:x1]
              # Kotak QR lebih dari 40% frame = deteksi palsu; potongannya tidak diperbesar (hemat memori).
              if w > W * 0.4 or h > H * 0.4:
                  crop = crop[:0]
              trials = {
                  "asli": frame,
                  "rasio_diperbaiki": cv2.resize(frame, (W * 2, H)) if W / H < 1.2 else frame,
              }
              if crop.size:
                  scale = min(3.0, 1600 / max(crop.shape[:2]))
                  big = cv2.resize(crop, None, fx=scale, fy=scale, interpolation=cv2.INTER_CUBIC)
                  trials["potong_qr_3x"] = big
                  gray = cv2.cvtColor(big, cv2.COLOR_BGR2GRAY)
                  sharp = cv2.addWeighted(gray, 1.8, cv2.GaussianBlur(gray, (0, 0), 3), -0.8, 0)
                  trials["potong_qr_3x_tajam"] = cv2.createCLAHE(2.0, (8, 8)).apply(sharp)
              for name, img in trials.items():
                  vals = decode(img)
                  if vals:
                      ok[name] += 1
                      invoice[name] += any(INVOICE.search(v) for v in vals)
              if wechat is not None:
                  try:
                      vals, _ = wechat.detectAndDecode(frame)
                      if vals:
                          ok["wechat"] += 1
                          invoice["wechat"] += any(INVOICE.search(v) for v in vals)
                  except Exception:
                      pass
          print(f"frame diambil: {frames}, ukuran frame: {shape}, QR terlihat: {seen}, WeChat QR tersedia: {wechat is not None}")
          print(f"memori puncak uji: {resource.getrusage(resource.RUSAGE_SELF).ru_maxrss // 1024} MB")
          if sizes:
              print(f"ukuran QR (piksel, median): lebar {statistics.median(s[0] for s in sizes):.0f}, tinggi {statistics.median(s[1] for s in sizes):.0f}; terkecil {min(s[0] for s in sizes):.0f}x{min(s[1] for s in sizes):.0f}, terbesar {max(s[0] for s in sizes):.0f}x{max(s[1] for s in sizes):.0f}")
          for m in methods:
              print(f"  {m:20s}: terbaca {ok[m]:3d}, berisi invoice {invoice[m]:3d}")
          PY
          REMOTE
