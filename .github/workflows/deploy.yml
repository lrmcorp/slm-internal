name: Deploy

# Push ke main = deploy otomatis. Deploy manual: tab Actions > Deploy > Run workflow.
# Build image di GitHub, VPS (self-hosted runner berlabel slm-vps) hanya menarik image dan restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lrmcorp/slm-internal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, slm-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deploy-from-image.sh
          sparse-checkout-cone-mode: false
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy ${{ github.sha }}
        run: |
          set -a; . /etc/lrm-deploy/slm.env; set +a
          IMAGE_REF="${{ env.IMAGE }}:${{ github.sha }}" LOCAL_TAG="slm-app:local" SERVICES="slm-app slm-gateway" \
          HEALTH_CONTAINER="slm-app" DEPLOY_SHA="${{ github.sha }}" \
          bash scripts/deploy-from-image.sh
      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io || true
