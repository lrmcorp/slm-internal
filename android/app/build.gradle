plugins {
    id "com.android.application"
}

// Satu kode untuk beberapa instance. Pilih dengan -Pbrand=slm (bawaan) atau -Pbrand=ankjy.
// Tiap brand punya applicationId sendiri, jadi aplikasi SLM dan ANKJY bisa terpasang bersamaan.
def brands = [
    // oldHosts: domain lama yang dialihkan ke domain baru; tetap dibuka di dalam aplikasi, bukan di browser.
    slm  : [appId: "id.playgo.slm",   url: "https://slm.lrmslm.com",   versionCode: 3, versionName: "2.1", oldHosts: "slm.lrmint.xyz"],
    ankjy: [appId: "id.playgo.ankjy", url: "https://ankjy.lrmslm.com", versionCode: 2, versionName: "1.1", oldHosts: "ankjy.net,www.ankjy.net"],
]
def brand = (project.findProperty("brand") ?: "slm").toString()
if (!brands.containsKey(brand)) throw new GradleException("Brand tidak dikenal: ${brand}. Pilihan: ${brands.keySet()}")
def brandConfig = brands[brand]

// Kunci rilis per brand: keystore/<brand>/keystore.properties; SLM juga boleh di keystore/ (letak lama).
def keystoreDir = rootProject.file("keystore/${brand}/keystore.properties").exists() ? "keystore/${brand}" : "keystore"
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("${keystoreDir}/keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "id.playgo.slm"
    compileSdk 35

    defaultConfig {
        applicationId brandConfig.appId
        minSdk 24
        targetSdk 35
        versionCode brandConfig.versionCode
        versionName brandConfig.versionName
        buildConfigField "String", "SLM_URL", "\"${project.findProperty("slmUrl") ?: brandConfig.url}\""
        buildConfigField "String", "OLD_HOSTS", "\"${brandConfig.oldHosts ?: ""}\""
    }

    // Nama aplikasi dan ikon per brand ada di src/brand/<brand>/res.
    sourceSets {
        main {
            res.srcDirs = ["src/main/res", "src/brand/${brand}/res"]
        }
    }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile rootProject.file("${keystoreDir}/" + keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps["storeFile"] ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Samakan versi kotlin-stdlib (jdk7/jdk8 lama bentrok dengan stdlib baru).
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.webkit:webkit:1.12.1"
}
