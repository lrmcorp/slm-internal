name: cctvslm
# Stack CCTV berdiri sendiri: deploy/restart SLM tidak menyentuh CCTV, dan sebaliknya.
# Jalankan dari folder ini (/opt/slm/cctv): docker compose up -d --build --remove-orphans

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  APP_URL: ${APP_URL:-https://cctv.lrmslm.com}
  CCTV_INGEST_TOKEN: ${CCTV_INGEST_TOKEN:?isi CCTV_INGEST_TOKEN di .env atau environment stack}
  # Lewat Cloudflare (https). Nginx mkr menolak koneksi yang tidak datang dari Cloudflare.
  SLM_BASE_URL: ${SLM_BASE_URL:-https://mkr.lrmslm.com}
  SLM_LOOKUP_PATH: ${SLM_LOOKUP_PATH:-/api/cctv/labels/lookup}
  SLM_SYNC_PATH: ${SLM_SYNC_PATH:-/api/cctv/labels/sync}
  SLM_API_TOKEN: ${SLM_API_TOKEN:-}
  SLM_SYNC_UPLOAD_PHOTO: ${SLM_SYNC_UPLOAD_PHOTO:-true}
  CCTV_AUTO_SYNC_PACKING: ${CCTV_AUTO_SYNC_PACKING:-true}
  CCTV_AI_PROVIDER: ${CCTV_AI_PROVIDER:-gemini}
  CCTV_AI_MODEL: ${CCTV_AI_MODEL:-gemini-3.5-flash-lite}
  CCTV_AI_API_KEY: ${CCTV_AI_API_KEY:-${GEMINI_API_KEY:-}}
  CCTV_ADMIN_EMAIL: ${CCTV_ADMIN_EMAIL:-}
  CCTV_ADMIN_PASSWORD: ${CCTV_ADMIN_PASSWORD:-}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-128M}
  SESSION_DRIVER: file
  CACHE_STORE: file
  LOG_STACK: daily
  LOG_DAILY_DAYS: 7
  # Live realtime: Laravel mengizinkan, proxy nginx mengalirkan MP4 dari go2rtc (lihat docs/video-live.md).
  CCTV_REALTIME_RELAY: ${CCTV_REALTIME_RELAY:-true}
  CCTV_REALTIME_SUBSTREAM: ${CCTV_REALTIME_SUBSTREAM:-true}

x-backend: &backend
  logging: *default-logging
  build:
    context: ./backend
  image: cctvslm-backend:latest
  pull_policy: never
  working_dir: /app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *backend-env
  volumes:
    - cctv_database:/app/database
    - cctv_storage:/app/storage
    - ./secrets:/run/secrets:ro

services:
  web:
    <<: *backend
    # artisan serve dengan 4 pekerja cukup untuk dashboard, ingest 3 kamera, dan live HLS (lihat README).
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      <<: *backend-env
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
    # Tidak dibuka ke host: nginx host -> 127.0.0.1:8095 -> proxy (di bawah) -> web:8000.
    mem_limit: ${CCTV_WEB_MEM_LIMIT:-256m}
    memswap_limit: ${CCTV_WEB_MEM_LIMIT:-256m}
    cpus: ${CCTV_WEB_CPUS:-0.50}

  # Pintu masuk dashboard: meneruskan semua ke web, dan mengalirkan live realtime dari go2rtc
  # setelah Laravel memeriksa login/token (X-Accel-Redirect). Nginx host tetap ke 127.0.0.1:8095.
  proxy:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${CCTV_WEB_PORT:-8095}:8080"
    depends_on:
      - web
      - go2rtc
    mem_limit: ${CCTV_PROXY_MEM_LIMIT:-48m}
    memswap_limit: ${CCTV_PROXY_MEM_LIMIT:-48m}
    cpus: ${CCTV_PROXY_CPUS:-0.25}

  # Relay RTSP: satu sambungan ke DVR per stream, dipakai bersama pembaca QR dan live realtime.
  # Paket diteruskan apa adanya (tanpa decode); hanya terhubung ke DVR selama ada yang membaca.
  # Tidak ada port yang dibuka ke host.
  go2rtc:
    logging: *default-logging
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    command: ["sh", "/cctv-go2rtc/start.sh"]
    volumes:
      - ./go2rtc/start.sh:/cctv-go2rtc/start.sh:ro
    environment:
      CCTV_CAMERA_14_URL: ${CCTV_CAMERA_14_URL:-${CCTV_RTSP_14:-}}
      CCTV_CAMERA_13_URL: ${CCTV_CAMERA_13_URL:-${CCTV_RTSP_13:-}}
      CCTV_CAMERA_12_URL: ${CCTV_CAMERA_12_URL:-${CCTV_RTSP_12:-}}
      GO2RTC_LOG_LEVEL: ${GO2RTC_LOG_LEVEL:-warn}
    # ±20 MB relay + ±50 MB per kamera yang ditonton dari browser tanpa H.265 (diubah ke H.264).
    mem_limit: ${CCTV_GO2RTC_MEM_LIMIT:-256m}
    memswap_limit: ${CCTV_GO2RTC_MEM_LIMIT:-256m}
    cpus: ${CCTV_GO2RTC_CPUS:-1.00}

  # Antrian dan penjadwal dalam satu container (docker/worker.sh).
  worker:
    <<: *backend
    command: ["sh", "/app/docker/worker.sh"]
    depends_on:
      - web
    mem_limit: ${CCTV_WORKER_MEM_LIMIT:-192m}
    memswap_limit: ${CCTV_WORKER_MEM_LIMIT:-192m}
    cpus: ${CCTV_WORKER_CPUS:-0.50}

  # Satu proses untuk semua kamera (satu thread per kamera); kamera putus tidak mematikan yang lain.
  vision:
    logging: *default-logging
    build:
      context: ./vision
      args:
        WITH_MODEL: ${CCTV_WITH_MODEL:-0}
        WITH_TESSERACT: ${CCTV_WITH_TESSERACT:-0}
    image: cctvslm-vision:latest
    pull_policy: never
    working_dir: /app
    command: python worker.py
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CCTV_API_BASE: http://web:8000
      CCTV_INGEST_TOKEN: ${CCTV_INGEST_TOKEN:?isi CCTV_INGEST_TOKEN di .env atau environment stack}
      CCTV_CAMERA_IDS: ${CCTV_CAMERA_IDS:-1,2,3}
      CCTV_LABEL_CAMERA_IDS: ${CCTV_LABEL_CAMERA_IDS:-1}
      CCTV_LABEL_MODE: ${CCTV_LABEL_MODE:-qr}
      CCTV_CAMERA_14_URL: ${CCTV_CAMERA_14_URL:-${CCTV_RTSP_14:-}}
      CCTV_CAMERA_13_URL: ${CCTV_CAMERA_13_URL:-${CCTV_RTSP_13:-}}
      CCTV_CAMERA_12_URL: ${CCTV_CAMERA_12_URL:-${CCTV_RTSP_12:-}}
      # Baca lewat relay go2rtc; kosongkan (CCTV_RTSP_RELAY=) untuk langsung ke DVR seperti dulu.
      CCTV_RTSP_RELAY: ${CCTV_RTSP_RELAY-rtsp://go2rtc:8554}
      CCTV_PROCESS_FPS: ${CCTV_PROCESS_FPS:-3}
      CCTV_HLS_DIRECTORY: /app/storage/app/private/cctv/live-video
      CCTV_LIVE_ON_DEMAND: ${CCTV_LIVE_ON_DEMAND:-true}
      CCTV_LIVE_IDLE_SECONDS: ${CCTV_LIVE_IDLE_SECONDS:-45}
      CCTV_LIVE_SEGMENT_SECONDS: ${CCTV_LIVE_SEGMENT_SECONDS:-1}
      CCTV_LIVE_USE_SUBSTREAM: ${CCTV_LIVE_USE_SUBSTREAM:-true}
      CCTV_LIVE_FPS: ${CCTV_LIVE_FPS:-6}
      CCTV_LIVE_MAX_WIDTH: ${CCTV_LIVE_MAX_WIDTH:-960}
      CCTV_DETECT_USE_SUBSTREAM: ${CCTV_DETECT_USE_SUBSTREAM:-auto}
      CCTV_WORK_MAX_WIDTH: ${CCTV_WORK_MAX_WIDTH:-640}
      CCTV_LABEL_WORK_MAX_WIDTH: ${CCTV_LABEL_WORK_MAX_WIDTH:-1280}
      CCTV_OBSERVATION_MAX_WIDTH: ${CCTV_OBSERVATION_MAX_WIDTH:-640}
      CCTV_GUARD_FPS: ${CCTV_GUARD_FPS:-2}
      CCTV_PERSON_MIN_CONFIDENCE: ${CCTV_PERSON_MIN_CONFIDENCE:-0.45}
      CCTV_AI_MODEL: ${CCTV_AI_MODEL:-gemini-3.5-flash-lite}
      CCTV_AI_API_KEY: ${CCTV_AI_API_KEY:-${GEMINI_API_KEY:-}}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - cctv_spool_1:/var/lib/cctv-spool/1
      - cctv_spool_2:/var/lib/cctv-spool/2
      - cctv_spool_3:/var/lib/cctv-spool/3
      - cctv_storage:/app/storage
    depends_on:
      - web
      - go2rtc
    mem_limit: ${CCTV_VISION_MEM_LIMIT:-256m}
    memswap_limit: ${CCTV_VISION_MEM_LIMIT:-256m}
    cpus: ${CCTV_VISION_CPUS:-1.00}

# Nama volume tetap sama dengan stack lama (cctvslm_cctv_*), jadi data dan bukti lama ikut terbawa.
volumes:
  cctv_database:
  cctv_storage:
  cctv_spool_1:
  cctv_spool_2:
  cctv_spool_3:
