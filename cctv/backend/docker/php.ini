; Batas memori PHP dan opcache untuk VPS kecil. Nilai memori bisa diubah lewat env PHP_MEMORY_LIMIT.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off

opcache.enable = 1
; artisan serve dan queue:work berjalan sebagai CLI, jadi opcache CLI ikut diaktifkan.
opcache.enable_cli = 1
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 4
opcache.max_accelerated_files = 6000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 1M
