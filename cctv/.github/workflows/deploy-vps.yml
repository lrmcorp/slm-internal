name: Deploy CCTV to VPS
on:
  push:
    branches: [ai-cctv-checker]
    paths: ['backend/**', 'vision/**', 'scripts/**', '.github/workflows/deploy-vps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cctv-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CCTV_AUTO_DEPLOY == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: cctv-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          fetch-depth: 0
      - name: Test backend
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan key:generate
          php artisan test
      - name: Send verified commit to VPS
        env:
          VPS_HOST: ${{ secrets.CCTV_VPS_HOST }}
          VPS_PORT: ${{ secrets.CCTV_VPS_PORT }}
          VPS_USER: ${{ secrets.CCTV_VPS_USER }}
          VPS_KEY: ${{ secrets.CCTV_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.CCTV_VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in VPS_HOST VPS_PORT VPS_USER VPS_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!variable}" ] || { echo "Missing setting: $variable"; exit 1; }
          done
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$VPS_KEY" > "$deploy_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          git bundle create "$deploy_dir/release.bundle" HEAD
          ssh -T -i "$deploy_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$deploy_dir/known_hosts" \
            "$VPS_USER@$VPS_HOST" deploy-cctv < "$deploy_dir/release.bundle"
