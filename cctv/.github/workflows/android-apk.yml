name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS address of the CCTV Laravel server
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'https://cctvslm.playgo.id' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Get packages and analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-pub
      - name: Build debug APK
        working-directory: mobile
        shell: bash
        run: |
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1;; esac
          args=("--dart-define=API_BASE_URL=$API_BASE_URL")
          for name in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID FIREBASE_SENDER_ID; do
            if [[ -n "${!name}" ]]; then args+=("--dart-define=$name=${!name}"); fi
          done
          flutter build apk --debug --no-pub "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-cctv-checker-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Publish downloadable internal test APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="android-test-${GITHUB_SHA:0:12}"
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk SLM-CCTV-Android.apk
          sha256sum SLM-CCTV-Android.apk > SLM-CCTV-Android.apk.sha256
          printf '%s\n' 'APK uji Android untuk server https://cctvslm.playgo.id.' 'Masuk dengan akun dashboard. Push memerlukan konfigurasi Firebase saat build dan layanan pengirim pada server.' 'APK debug ini untuk pengujian, bukan rilis Play Store. Repositori publik: berkas APK dapat diunduh siapa pun; data CCTV tetap memerlukan autentikasi.' > /tmp/apk-notes.md
          gh release create "$tag" SLM-CCTV-Android.apk SLM-CCTV-Android.apk.sha256 --target "$GITHUB_SHA" --title "SLM CCTV Android · ${GITHUB_SHA:0:7}" --notes-file /tmp/apk-notes.md --prerelease || echo "::warning::Gagal mempublikasikan release ke GitHub Releases (API error); APK tetap tersedia di GitHub Artifacts."
