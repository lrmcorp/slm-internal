# Pintu masuk dashboard CCTV di dalam stack. Nginx host tetap meneruskan cctv.lrmslm.com ke 127.0.0.1:8095,
# sekarang ke container ini: semua permintaan diteruskan apa adanya ke Laravel (web:8000), kecuali video
# realtime yang diizinkan Laravel lewat X-Accel-Redirect lalu dialirkan langsung dari go2rtc tanpa PHP.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;
    server_tokens off;
    # DNS Docker; upstream dicari saat dipakai, jadi proxy tetap hidup walau web/go2rtc baru menyala.
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_http_version 1.1;

    server {
        listen 8080;

        location / {
            set $web http://web:8000;
            proxy_pass $web;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Hanya bisa dicapai lewat X-Accel-Redirect dari Laravel (sudah memeriksa login/token).
        location /_go2rtc/ {
            internal;
            set $go2rtc http://go2rtc:1984;
            rewrite ^/_go2rtc/(.*)$ /$1 break;
            proxy_pass $go2rtc;
            proxy_set_header Host go2rtc;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "private, no-store" always;
            add_header X-Accel-Buffering no always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
